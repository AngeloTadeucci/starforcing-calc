<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>SF tests</title></head>
<body><pre id="out"></pre>
<script src="rates.js"></script>
<script src="simulator.js"></script>
<script src="optimizer.js"></script>
<script src="fodder.js"></script>
<script>
  const log = (...a) => document.getElementById("out").textContent += a.join(" ") + "\n";
  log("baseCost(17, 160):", SF.baseCost(17, 160));
  log("baseCost(0, 160):", SF.baseCost(0, 160));
  log("boomDropStar(22):", SF.boomDropStar(22));   // 17
  log("boomDropStar(20):", SF.boomDropStar(20));   // 15
  log("boomDropStar(15):", SF.boomDropStar(15));   // 12
  log("boomDropStar(26):", SF.boomDropStar(26));   // 20

  // Fodder comparison — expectations cross-checked against the closed-form
  // optimizer math run standalone (level 160 target, level 150 fodder, 22★).
  const check = (name, cond) => log((cond ? "PASS" : "FAIL") + "  " + name);
  const near = (a, b, tol) => Math.abs(a - b) <= tol * Math.abs(b);
  const fr = SF.fodder.compare({
    itemLevel: 160, fodderLevel: 150, goalStar: 22,
    baseOpts: { mvp: "none", event: "none", starCatching: true },
  });
  check("fodder: rawCheap ~16.85B", near(fr.rawCheap.total, 16.85e9, 0.001));
  check("fodder: rawZero ~52.14B", near(fr.rawZero.total, 52.14e9, 0.001));
  check("fodder: sweep is 16..23★", fr.strategies.length === 8 && fr.strategies[7].transferAt === 23);
  const t21 = fr.strategies.find((s) => s.transferAt === 21);
  const t22 = fr.strategies.find((s) => s.transferAt === 22);
  check("fodder: best transfer is 21★", fr.best.transferAt === 21);
  check("fodder: transfer@21 ~21.43B", near(t21.total, 21.43e9, 0.001));
  check("fodder: transfer@22 ~24.57B", near(t22.total, 24.57e9, 0.001));
  check("fodder: overshoot row needs no taps", fr.strategies[7].finishMesos === 0);
  const fr2 = SF.fodder.compare({
    itemLevel: 160, fodderLevel: 150, goalStar: 22,
    fodderPrice: 100e6, sparePrice: 2e9,
    baseOpts: { mvp: "none", event: "none", starCatching: true },
  });
  const t21p = fr2.strategies.find((s) => s.transferAt === 21);
  check("fodder: copy price folds into totals", near(t21p.total, t21.total + 100e6 * t21.copies, 1e-9));
  check("fodder: spare price folds into raw", near(fr2.rawCheap.total, fr.rawCheap.total + fr.rawCheap.spares * 2e9, 1e-9));
  check("fodder: level gap >10 flagged", SF.fodder.compare({
    itemLevel: 200, fodderLevel: 150, goalStar: 22,
    baseOpts: { mvp: "none", event: "none", starCatching: true },
  }).levelGapOk === false);
  // Safeguarding the fodder at 15–17★: pricier climb, fewer fodder booms —
  // strictly fewer copies and strictly more fodder mesos on every row that
  // taps 15–17★.
  const frSg = SF.fodder.compare({
    itemLevel: 160, fodderLevel: 150, goalStar: 22, fodderSafeguard: true,
    baseOpts: { mvp: "none", event: "none", starCatching: true },
  });
  const t21sg = frSg.strategies.find((s) => s.transferAt === 21);
  check("fodder: SG fodder uses fewer copies", t21sg.copies < t21.copies);
  check("fodder: SG fodder climb costs more", t21sg.fodderMesos > t21.fodderMesos);
  // Exactly 1 copy up to a float epsilon — star catching renormalizes
  // maintain/boom and leaves b ≈ 1e-17 instead of a clean 0.
  check("fodder: SG fodder can't boom below 18★",
    Math.abs(frSg.strategies.find((s) => s.transferAt === 18).copies - 1) < 1e-9);
  // Boom-reduction events + MVP make the 23★ overshoot ~tie 21★ on price
  // (within ~1%); the pick must break toward fewer copies, not the raw min.
  const frTie = SF.fodder.compare({
    itemLevel: 150, fodderLevel: 140, goalStar: 22,
    baseOpts: { mvp: "diamond", event: "shiningStarForce", starCatching: true },
  });
  check("fodder: near-tie breaks toward fewer copies (21★, not 23★)", frTie.best.transferAt === 21);

  // Issue #5: the MVP discount now covers every tap up to 17★ (so it applies at
  // 16→17 and stops at 17→18), and it stacks multiplicatively with the 30%-off
  // event rather than additively. Anchored on the in-game reading from the
  // issue: lvl-200 item, 16→17 during Shining Star Force with Silver MVP,
  // 83,999,600 base → 57,035,729 charged, i.e. × 0.70 × 0.97 = × 0.679.
  const mvpOpts = (mvp, event) => ({ mvp, event: event || "none", enhanceMode: 0 });
  check("mvp: lvl-200 16★ base is 83,999,600", SF.baseCost(16, 200) === 83999600);
  check("mvp: silver applies at 16★", near(SF.costMultiplier(16, mvpOpts("silver")), 0.97, 1e-12));
  check("mvp: silver still applies at 15★", near(SF.costMultiplier(15, mvpOpts("silver")), 0.97, 1e-12));
  check("mvp: silver stops at 17★", SF.costMultiplier(17, mvpOpts("silver")) === 1);
  check("mvp: gold/diamond scale at 16★",
    near(SF.costMultiplier(16, mvpOpts("gold")), 0.95, 1e-12) &&
    near(SF.costMultiplier(16, mvpOpts("diamond")), 0.9, 1e-12));
  check("mvp: stacks multiplicatively with 30% off, not additively",
    near(SF.costMultiplier(16, mvpOpts("silver", "shiningStarForce")), 0.679, 1e-12));
  check("mvp: 17★ keeps the event discount without MVP",
    near(SF.costMultiplier(17, mvpOpts("silver", "shiningStarForce")), 0.7, 1e-12));
  // Within a meso of the in-game price — the engine rounds to nearest where the
  // client appears to round up, which is invisible at simulation scale.
  check("mvp: 16→17 SSF + silver ≈ 57,035,729 in-game",
    Math.abs(SF.baseCost(16, 200) * SF.costMultiplier(16, mvpOpts("silver", "shiningStarForce")) - 57035729) <= 1);
  // Enhancement Modes take the same proportional cut (mode mult × 0.97), and
  // the Safeguard premium stays undiscounted, exactly as the event discount does.
  check("mvp: Mode 3 at 16★ takes the same proportional cut",
    near(SF.costMultiplier(16, { mvp: "silver", event: "none", enhanceMode: 3 }), 2.5 * 0.97, 1e-12));
  check("mvp: Safeguard premium is not discounted",
    near(SF.costMultiplier(16, { mvp: "silver", event: "none", enhanceMode: 0, safeguard: true }), 0.97 + 2, 1e-12));

  // Issue #4: boom-count buckets must stay integer-exact for low counts even
  // when the span exceeds the bucket cap. The old continuous fallback merged
  // 0 and 1 booms into one bar labelled "0" once max booms passed 30.
  const wide = [];
  for (let v = 0; v <= 50; v++) wide.push(v, v); // span 51 > 30, two of each
  const ib = SF.bucketizeIntegers(wide, 30);
  check("hist: bucket count capped", ib.length === 30);
  check("hist: 0-boom bar stays exact", ib[0].from === 0 && ib[0].to === 0 && ib[0].count === 2);
  check("hist: singles cover 0..28", ib[28].from === 28 && ib[28].to === 28 && ib[28].count === 2);
  check("hist: tail collapses into 29–50", ib[29].from === 29 && ib[29].to === 50 && ib[29].count === 44);
  const narrow = SF.bucketizeIntegers([0, 1, 1, 3], 30);
  check("hist: narrow span keeps one bar per integer", narrow.length === 4 && narrow[1].count === 2 && narrow[2].count === 0);

  // reachableFloor: the lowest star a run can attempt once boom re-climbs are
  // followed to a fixpoint. This is what decides which per-star rows stay live
  // when the current ★ is already above 21. Each expectation is cross-checked
  // below against the lowest star the real sim loop actually visits.
  const floorBase = { mvp: "none", event: "none", starCatching: true };
  const mkPlan = (fn) => {
    const p = {};
    [15, 16, 17, 18, 19, 20, 21].forEach((s) => (p[s] = fn(s)));
    return p;
  };
  const fOpts = (p) => Object.assign({ starPlan: p }, floorBase);
  const pVanilla = mkPlan(() => ({ mode: 1, safeguard: false }));
  const pSg = mkPlan((s) => ({ mode: 1, safeguard: s <= 17 }));
  const pNoBoom = mkPlan((s) => (s <= 17 ? { mode: 1, safeguard: true } : { mode: 4, safeguard: false }));
  const floorCases = [
    // 22★ booms to 17★, and a boom at 18/19★ on the way back up drops to 12★.
    ["22→23 vanilla", 22, 23, pVanilla, 12],
    // Safeguard alone doesn't hold: 18–21★ can still boom to 12★.
    ["22→23 SG 15–17 only", 22, 23, pSg, 12],
    // SG 15–17 + Mode 4 on 18–21: nothing in [17,22) booms, so 17★ is a hard floor.
    ["22→23 SG + Mode 4", 22, 23, pNoBoom, 17],
    // 23★ booms to 19★, but the re-climb passes 22★, which drops to 17★.
    ["23→24 SG + Mode 4", 23, 24, pNoBoom, 17],
    ["26→27 SG + Mode 4", 26, 27, pNoBoom, 17],
    ["17→22 vanilla", 17, 22, pVanilla, 12],
    ["17→22 SG + Mode 4", 17, 22, pNoBoom, 17],
    ["12→15 vanilla", 12, 15, pVanilla, 12],
  ];
  floorCases.forEach(([name, cur, tgt, p, want]) => {
    check("floor: " + name + " → " + want + "★", SF.reachableFloor(cur, tgt, fOpts(p)) === want);
  });
  // The floor must be exactly the lowest star the sim visits: never above it
  // (rows would be greyed that the run really uses) and never below it (rows
  // would be shown live that it can't reach).
  floorCases.forEach(([name, cur, tgt, p]) => {
    const t = SF.buildStarTables(tgt, 160, fOpts(p));
    let lo = cur;
    for (let i = 0; i < 20000; i++) {
      let star = cur;
      while (star < tgt) {
        if (t.guaranteed[star]) { star++; continue; }
        const r = Math.random();
        if (r < t.succ[star]) star++;
        else if (r < t.succMaint[star]) { /* maintain */ }
        else star = t.boomTo[star];
        if (star < lo) lo = star;
      }
    }
    check("floor: " + name + " matches sim (" + lo + "★)", lo === SF.reachableFloor(cur, tgt, fOpts(p)));
  });
</script>
</body></html>
